# HBOX optional app: Status (Uptime Kuma). Enable with: sudo hbox apps enable status
# Served by HBOX's nginx at https://<address>:4443/ (see app.json).
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.11
    container_name: hbox-status-kuma
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}/apps/status
        target: /app/data
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:-Etc/UTC}
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    name: hbox-frontend
    external: true

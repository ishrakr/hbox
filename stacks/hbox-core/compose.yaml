# HBOX Core: the HTTPS entry point and dashboard for every HBOX app.
# Stock nginx; its configuration and the dashboard are mounted read-only from
# this checkout, so updates from git apply with a reload (sudo hbox update).
# Optional apps add their ports in compose.override.yaml (generated).
name: hbox-core

services:
  hbox-nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}
    container_name: hbox-nginx
    ports:
      - "80:80"
      - "443:443"
      # Photos, Files and Admin by port, for IP addresses and Tailscale names.
      - "2443:2443"
      - "3443:3443"
      - "5443:5443"
      # Backups (Backrest, which runs on the host).
      - "6443:6443"
    # Backrest listens on Docker's bridge address on the host, not the network.
    extra_hosts:
      - "hbox-host:host-gateway"
    volumes:
      # Directories, not single files: git replaces files on update, and a
      # single-file mount would keep showing the old version.
      - type: bind
        source: ../../config/nginx
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../config/dashboard
        target: /usr/share/nginx/hbox-dashboard
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../certs
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
      # Disk/backup/update status and the app list (written by the host).
      - type: bind
        source: ${HBOX_STATUS_DIR:-/var/lib/hbox/dashboard}
        target: /var/lib/hbox-dashboard
        read_only: true
        bind:
          create_host_path: false
      # Dashboard buttons: nginx may only create request files here.
      - type: bind
        source: ${HBOX_REQUESTS_DIR:-/var/lib/hbox/requests}
        target: /var/lib/hbox-requests
        bind:
          create_host_path: false
      # The administrator login the update button checks (hash only).
      - type: bind
        source: ${HBOX_AUTH_DIR:-/var/lib/hbox/nginx-auth}
        target: /etc/nginx/hbox-auth
        read_only: true
        bind:
          create_host_path: false
      # nginx sites of enabled optional apps (generated by hbox apps enable).
      - type: bind
        source: ${HBOX_NGINX_APPS_DIR:-/var/lib/hbox/nginx-apps}
        target: /etc/nginx/hbox-apps
        read_only: true
        bind:
          create_host_path: false
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  frontend:
    name: hbox-frontend
    external: true

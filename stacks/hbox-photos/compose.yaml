# HBOX Photos: Immich, its machine learning, cache and PostgreSQL database.
# Upgrade only with the HBOX upgrade procedure (database backup first).
name: hbox-photos

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2.7.5}
    container_name: immich-server
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:2283:2283"
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}/immich/upload
        target: /usr/src/app/upload
        bind:
          create_host_path: false
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in the HBOX .env}
      DB_DATABASE_NAME: immich
      DB_PORT: "5432"
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      TZ: ${TZ:-Etc/UTC}
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    networks:
      - frontend
      - immich
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2.7.5}
    container_name: immich-machine-learning
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}/immich/model-cache
        target: /cache
        bind:
          create_host_path: false
    environment:
      TZ: ${TZ:-Etc/UTC}
      # Gunicorn 25's control socket can deadlock the worker at startup under
      # load (7 of 8 starts hung in testing; none without it).
      GUNICORN_CMD_ARGS: --no-control-socket
    networks:
      - immich
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    container_name: immich_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immich
    restart: unless-stopped

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in the HBOX .env}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/DATA}/immich/pgdata
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - immich
    restart: unless-stopped

networks:
  frontend:
    name: hbox-frontend
    external: true
  immich:
    name: hbox-immich

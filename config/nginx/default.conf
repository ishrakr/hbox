# HBOX nginx site. Mounted read-only from /opt/hbox/config/nginx into the stock
# nginx image's conf.d, so updates from git apply on reload without a build.
ssl_certificate /etc/nginx/ssl/selfsigned.crt;
ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
ssl_protocols TLSv1.2 TLSv1.3;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Resolve service names again after containers are recreated, not just at boot.
resolver 127.0.0.11 valid=30s ipv6=off;

# Slows password guessing on the dashboard's update login.
limit_req_zone $binary_remote_addr zone=hbox_actions:1m rate=10r/m;

# How HBOX is reached, from any address (hbox.local, LAN IP, Tailscale IP or
# tailnet name). Every app has its own port, so it runs at the root of an
# address, which works with IPs and tailnet names where subdomains cannot:
#
#   https://<address>/         dashboard
#   https://<address>:2443/    Photos (Immich)
#   https://<address>:3443/    Files (Nextcloud)
#   https://<address>:5443/    Admin (Dockge)
#   https://<address>:6443/    Backups (Backrest, on the host)
#   /photos, /files, /admin, /backups on 443 redirect to those ports.
#   photos.local, files.local, admin.local also serve the apps on 443.
#
# Optional apps (sudo hbox apps enable NAME) add their own port in
# /etc/nginx/hbox-apps/, generated from apps/NAME/app.json.

server {
    listen 80 default_server;
    server_name _;

    # The public HBOX CA certificate, so devices can trust HBOX over plain HTTP
    # before they trust it. Only this one file is served from the cert mount.
    location = /hbox-ca.crt {
        default_type application/x-x509-ca-cert;
        alias /etc/nginx/ssl/hbox-ca.crt;
        # A new CA (reinstall) must not be hidden by a cached old one.
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

# The dashboard, for every hostname and address not listed below.
server {
    listen 443 ssl default_server;
    server_name _;

    location = /hbox-ca.crt {
        default_type application/x-x509-ca-cert;
        alias /etc/nginx/ssl/hbox-ca.crt;
        add_header Content-Disposition 'attachment; filename="hbox-ca.crt"' always;
        add_header Cache-Control "no-cache" always;
    }

    location = /photos { return 302 https://$host:2443/; }
    location ^~ /photos/ { return 302 https://$host:2443/; }
    location = /files { return 302 https://$host:3443/; }
    location ^~ /files/ { return 302 https://$host:3443/; }
    location = /admin { return 302 https://$host:5443/; }
    location ^~ /admin/ { return 302 https://$host:5443/; }
    location = /backups { return 302 https://$host:6443/; }
    location ^~ /backups/ { return 302 https://$host:6443/; }

    # Calendar/contacts discovery on the main address points at Files.
    location = /.well-known/carddav { return 301 https://$host:3443/remote.php/dav; }
    location = /.well-known/caldav { return 301 https://$host:3443/remote.php/dav; }

    # Health checks for the dashboard's status dots (same origin, no CORS).
    location = /health/photos {
        include /etc/nginx/conf.d/hbox-proxy.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $photos_health http://immich-server:2283;
        rewrite ^ /api/server/ping break;
        proxy_pass $photos_health;
    }
    location = /health/files {
        include /etc/nginx/conf.d/hbox-proxy.inc;
        proxy_set_header Host files.local;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_verify off;
        set $files_health https://nextcloud-web:443;
        rewrite ^ /status.php break;
        proxy_pass $files_health;
    }
    location = /health/admin {
        include /etc/nginx/conf.d/hbox-proxy.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $admin_health http://hbox-dockge:5001;
        rewrite ^ / break;
        proxy_pass $admin_health;
    }

    location = /health/backups {
        include /etc/nginx/conf.d/hbox-proxy.inc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        rewrite ^ / break;
        proxy_pass http://hbox-host:9898;
    }

    # Health checks of enabled optional apps (generated).
    include /etc/nginx/hbox-apps/*.health;

    # Written by the host: server facts (every minute) and the app list
    # (config/dashboard/apps.json plus enabled optional apps and local links).
    location = /status.json {
        alias /var/lib/hbox-dashboard/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location = /apps.json {
        alias /var/lib/hbox-dashboard/apps.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }
    # Logos of enabled optional apps (copied from their folders by hbox).
    location ^~ /app-icons/ {
        alias /var/lib/hbox-dashboard/icons/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        # SVG opened directly must not run scripts.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
    }
    location = /update.json {
        alias /var/lib/hbox-dashboard/update.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Dashboard actions. A PUT drops a request file into a folder the host
    # watches (hbox-dashboard.path), which then runs `hbox update`. nginx
    # itself gets no access to Docker or the host. The custom header keeps
    # other web pages from sending these requests (it forces a CORS preflight,
    # which nginx never allows).
    location = /api/check {
        limit_except PUT { deny all; }
        if ($http_x_hbox_action != "1") { return 403; }
        limit_req zone=hbox_actions burst=5 nodelay;
        client_max_body_size 1k;
        dav_methods PUT;
        dav_access user:rw group:rw;
        alias /var/lib/hbox-requests/check;
    }
    # Installing an update needs the HBOX administrator login.
    location = /api/update {
        limit_except PUT { deny all; }
        if ($http_x_hbox_action != "1") { return 403; }
        limit_req zone=hbox_actions burst=5 nodelay;
        auth_basic "HBOX";
        auth_basic_user_file /etc/nginx/hbox-auth/htpasswd;
        # A wrong login is answered with 403, not 401: browsers only show
        # their password popup for 401, so the dashboard's own form is used.
        error_page 401 = @hbox_login_failed;
        client_max_body_size 1k;
        dav_methods PUT;
        dav_access user:rw group:rw;
        alias /var/lib/hbox-requests/update;
    }
    # Power menu: the same login, one fixed file name per action.
    location ~ ^/api/power/(restart|shutdown|apps-restart|apps-stop|apps-start)$ {
        limit_except PUT { deny all; }
        if ($http_x_hbox_action != "1") { return 403; }
        limit_req zone=hbox_actions burst=5 nodelay;
        auth_basic "HBOX";
        auth_basic_user_file /etc/nginx/hbox-auth/htpasswd;
        error_page 401 = @hbox_login_failed;
        client_max_body_size 1k;
        dav_methods PUT;
        dav_access user:rw group:rw;
        alias /var/lib/hbox-requests/$1;
    }
    location = /power.json {
        alias /var/lib/hbox-dashboard/power.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location @hbox_login_failed {
        default_type application/json;
        return 403 '{"error":"login"}';
    }

    # The dashboard's static files, from /opt/hbox/config/dashboard.
    location / {
        root /usr/share/nginx/hbox-dashboard;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    }
}

# Photos (Immich) on port 2443 of every address, and photos.local.
server {
    listen 443 ssl;
    listen 2443 ssl;
    server_name photos.local photos _;
    client_max_body_size 50000M;
    # Stream uploads straight to Immich instead of buffering them first.
    proxy_request_buffering off;
    client_body_buffer_size 1024k;

    location / {
        include /etc/nginx/conf.d/hbox-proxy.inc;
        # With the port, so links the app generates come back to this port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $photos http://immich-server:2283;
        proxy_pass $photos;
    }
}

# Files (Nextcloud) on port 3443 of every address, and files.local.
server {
    listen 443 ssl;
    listen 3443 ssl;
    server_name files.local files _;
    client_max_body_size 50000M;
    proxy_request_buffering off;

    location = /.well-known/carddav {
        return 301 https://$http_host/remote.php/dav;
    }

    location = /.well-known/caldav {
        return 301 https://$http_host/remote.php/dav;
    }

    location ^~ /.well-known {
        return 301 https://$http_host/index.php$uri$is_args$args;
    }

    location / {
        include /etc/nginx/conf.d/hbox-proxy.inc;
        # Nextcloud builds absolute links from Host; keep the port in it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The LinuxServer image uses a self-signed certificate internally.
        # This hop stays on the Docker frontend network.
        proxy_ssl_verify off;
        set $files https://nextcloud-web:443;
        proxy_pass $files;
    }
}

# HBOX Admin (Dockge) on port 5443 of every address, and admin.local.
# Keep HBOX on the LAN or Tailscale only: Admin controls the whole server.
server {
    listen 443 ssl;
    listen 5443 ssl;
    server_name admin.local admin _;

    location / {
        include /etc/nginx/conf.d/hbox-proxy.inc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $admin http://hbox-dockge:5001;
        proxy_pass $admin;
    }
}

# Backups (Backrest) on port 6443. Backrest runs on the host (it reads all
# data and dumps the databases) and listens only on Docker's bridge address;
# it asks for the HBOX administrator login itself.
server {
    listen 6443 ssl;
    server_name _;
    client_max_body_size 10M;

    location / {
        include /etc/nginx/conf.d/hbox-proxy.inc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Live progress is streamed; pass it through as it arrives.
        proxy_buffering off;
        proxy_pass http://hbox-host:9898;
    }
}

# Optional apps, one server block each (generated by `hbox apps enable`).
include /etc/nginx/hbox-apps/*.conf;
